services:
  db:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_PASSWORD: pw, POSTGRES_DB: rag}
    volumes: [pgdata:/var/lib/postgresql/data]
  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:pw@db/rag
    ports: ["8000:8000"]
    depends_on: [db]
volumes: {pgdata: {}}
